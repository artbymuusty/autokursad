flight_backend:
  connection_string: "serial:///dev/ttyUSB0:57600"  # TODO: ekip gerçek portu belirleyecek
camera:
  device_index_or_pipeline: 0  # TODO: ekip gerçek kamera indexini/pipeline'ı belirleyecek
control_gains:
  kp_horizontal: 0.5   # TODO: fiziksel testle kalibre edilecek
  kp_vertical: 0.3      # TODO: fiziksel testle kalibre edilecek
  kp_altitude: 0.5       # TODO: fiziksel testle kalibre edilecek
  # Operator-specified centering precision (2026-08-13 revision): ±0.01
  # normalized in both axes.
  centering_tolerance_x: 0.01
  centering_tolerance_y: 0.01
actuator:
  pickup_channel: null  # TODO: gerçek servo/AUX kanal numarası

# ADR-011 (2026-08-17): real payload mass, recorded here because the
# SIMULATION deliberately does not use it.
#
# The real payload is 1.05 kg. The Gazebo x500_mono_cam_down airframe is
# 2.0663 kg (base_link 2.0 + 4 rotors at 0.0161), so carrying two real
# payloads would be +2.10 kg = +101% all-up mass. That pushes
# thrust-to-weight and MPC_THR_HOVER far outside the tuning this SITL model
# ships with, and the failure mode would be a sim artefact rather than
# anything the real airframe would show. Simulation therefore mounts
# 0.15 kg per payload (+14.5%), which keeps drop physics honest -- the body
# still falls, bounces and settles under gravity -- without invalidating the
# vehicle dynamics every other measurement in ADR-009/010 is calibrated
# against.
#
# The real airframe is NOT the x500: this number is for the team's own
# mass/thrust budget, not for the simulator.
payload:
  real_mass_kg: 1.05
  simulated_mass_kg: 0.15   # Tools/simulation/gz/worlds/default.sdf

# --- Climb-then-Cruise hareket makinesi (2026-09-02) -------------------------
# GERCEK UCUS PROFILI -- SITL'den KASITLI OLARAK GEVSEK.
#
# Gerekce (docs/flight-control-analysis.md 2.4): gercek telemetri linkinde
# (radio/4G) gecikme Gazebo'ya gore cok daha yuksek ve gercek IMU/GPS gurultulu.
# Simulasyonda dogrulanmis dar bir esik gercek ucusta state'in HIC gecmemesine
# yol acar -- ozellikle vz_settle ve attitude_rate_limit, ikisi de dogrudan
# sensor gurultusu tabanina oturur.
#
# kp_vertical'da uygulanan ayni ilke: bir gercek-arac esigi simulator
# olcumuyle DARALTILMAZ.
#
# TODO: butun bu degerler ilk saha ucusunun LOGLARIYLA kalibre edilecek.
# Yontem: MOTION_STATE_CHANGED olaylarindaki guard verilerine bakip
# (vz_m_s, attitude_rate_deg_s) gercek taban gurultusunu olcmek, esigi onun
# ~3 katina koymak. Kalibrasyon oncesi bu profille UCULMAMALIDIR.
motion_profile:
  enabled: true
  alt_tol_m: 0.50            # TODO: saha logu ile kalibre
  vz_settle_m_s: 0.35        # TODO: saha logu ile kalibre (gurultu tabani)
  hold_min_s: 0.50           # TODO: link gecikmesine gore
  hold_max_s: 5.0
  attitude_rate_limit_deg_s: 25.0   # TODO: gercek IMU gurultu tabani
  attitude_stable_samples: 3
  arrival_radius_m: 3.0      # TODO: gercek GPS dagilimina gore
  arrival_speed_m_s: 0.50      # TODO: saha logu ile kalibre
  cruise_speed_m_s: 2.0      # ilk ucuslar icin muhafazakar
  accel_m_s2: 1.0
  vertical_speed_m_s: 1.0
  leg_timeout_s: 60.0
  vertical_timeout_s: 20.0
  arrival_hold_s: 1.0
